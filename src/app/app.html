<header class="navbar">
  <div class="logo">Transport Facility Manager</div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab-btn" [class.active]="activeTab === 'find'" (click)="activeTab = 'find'">
      Find a Ride
    </button>
    <button class="tab-btn" [class.active]="activeTab === 'offer'" (click)="activeTab = 'offer'">
      Offer a Ride
    </button>
  </div>

  <div class="content">
    @if (activeTab === 'find') {
      <app-find-ride></app-find-ride>
    } @else {
      <app-offer-ride></app-offer-ride>
    }
  </div>
</div>
