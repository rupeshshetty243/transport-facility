<div class="card">
  <h2>Add Ride</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="grid">
    <input placeholder="Employee ID" formControlName="employeeId" />

    <select formControlName="vehicleType">
      <option value="Car">Car</option>
      <option value="Bike">Bike</option>
    </select>

    <input placeholder="Vehicle No" formControlName="vehicleNo" />
    <input type="number" placeholder="Seats" formControlName="vacantSeats" />
    <input type="time" formControlName="time" />
    <input placeholder="Pickup Point" formControlName="pickupPoint" />
    <input placeholder="Destination" formControlName="destination" />

    <button type="submit" class="primary">Add Ride</button>
  </form>
</div>
