<div class="card">
  <h2>Available Rides</h2>

  <div class="filters">
    <input type="time"
           [(ngModel)]="selectedTime"
           (change)="applyFilters()" />

    <select [(ngModel)]="selectedVehicle"
            (change)="applyFilters()">
      <option value="All">All Vehicles</option>
      <option value="Car">Car</option>
      <option value="Bike">Bike</option>
    </select>
  </div>

  <p *ngIf="filteredRides.length === 0" class="empty">
    No matching rides available
  </p>

  <div *ngFor="let ride of filteredRides" class="ride-card">
    <div class="ride-info">
      <div><strong>{{ ride.vehicleType }}</strong> • {{ ride.time }}</div>
      <div>Seats: {{ ride.vacantSeats }}</div>
      <div>{{ ride.pickupPoint }} → {{ ride.destination }}</div>
    </div>

    <app-book-ride [ride]="ride"></app-book-ride>
  </div>
</div>
